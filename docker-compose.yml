# Archon - Single Container Architecture
# Everything runs in ONE container: PostgreSQL + FastAPI + MCP + Agents

services:
  archon:
    build:
      context: ./python
      dockerfile: Dockerfile.server
    container_name: archon
    ports:
      - "8181:8181"
    environment:
      - ARCHON_SERVER_PORT=8181
      - ARCHON_SERVER_HOST=localhost
      # Database is embedded in the same container
      - ARCHON_DATABASE_URL=postgresql://archon:archon_local_dev@localhost:5432/archon
      # Ollama on host (accessible via Docker bridge IP 172.17.0.1)
      # Run scripts/configure_ollama_docker.sh first to configure Ollama
      - OLLAMA_URL=http://172.17.0.1:11434
    volumes:
      # Persist PostgreSQL data
      - postgres_data:/var/lib/postgresql/data
      # Hot reload for development
      - ./python/src:/app/src
      - ./python/tests:/app/tests
      - ./migration:/docker-entrypoint-initdb.d/migrations:ro
      # Repository codebases
      - /home/zebastjan/dev/archon:/archon:rw
      - /home/zebastjan/dev/syllablaze:/syllablaze:rw
      - /home/zebastjan/dev/octofriend:/octofriend:rw
      - /home/zebastjan/dev/Omnibus:/Omnibus:rw
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8181/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
