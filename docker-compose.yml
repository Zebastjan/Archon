# Archon - Simplified Architecture
# Just two services: database and server (which includes MCP)

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: archon-postgres
    environment:
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: archon_local_dev
      POSTGRES_DB: archon
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts/docker-postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archon -d archon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  archon-server:
    build:
      context: ./python
      dockerfile: Dockerfile.server
    container_name: archon-server
    ports:
      - "8181:8181"
    environment:
      - ARCHON_DATABASE_URL=postgresql://archon:archon_local_dev@postgres:5432/archon
      - ARCHON_SERVER_PORT=8181
      - ARCHON_MCP_PORT=8181
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./python/src:/app/src
      - ./python/tests:/app/tests
      - ./migration:/app/migration
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.server.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8181",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8181/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge