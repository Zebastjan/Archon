[project]
name = "archon"
version = "0.1.0"
description = "Archon - the command center for AI coding assistants."
readme = "README.md"
requires-python = ">=3.12"
# Base dependencies - empty since we're using dependency groups
dependencies = [
    "aiohttp>=3.11.18",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.1.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-language-pack>=0.7.2",
]

# PyTorch CPU-only index configuration
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Sources configuration to use CPU-only PyTorch
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
# Development dependencies for linting and testing
dev = [
    "mypy>=1.17.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.5",
    "factory-boy>=3.3.0",
]

# Server container dependencies
server = [
    # Web framework (aligned with agent-work-orders)
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "python-multipart>=0.0.20",
    "watchfiles>=0.18",
    # MCP protocol support
    "mcp>=1.12.2",
    # Database and storage (PostgreSQL only - no Supabase)
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # AI/ML libraries
    "openai==1.71.0",
    # Document processing
    "docling>=2.0.0",
    "pypdf2>=3.0.1",
    "pdfplumber>=0.11.6",
    "python-docx>=1.1.2",
    "markdown>=3.8",
    # Security and utilities
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.9",
    # Core utilities (aligned with agent-work-orders)
    "httpx>=0.28.1",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    # OPTIONAL: Docker SDK only needed for legacy Docker socket monitoring mode
    # Uncomment if ENABLE_DOCKER_SOCKET_MONITORING=true (not recommended - security risk)
    # "docker>=6.1.0",
    "tldextract>=5.0.0",
    # Logging
    "logfire>=0.30.0",
    "gitpython>=3.1.46",
    # Tree-sitter for multi-language code parsing
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-language-pack>=0.7.2",
    # Git ignore pattern matching
    "pathspec>=0.12.1",
    # Code auditing
    "semgrep>=1.60.0",
]

# Optional reranking dependencies for server
server-reranking = [
    "sentence-transformers>=4.1.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

# MCP container dependencies
mcp = [
    "mcp==1.12.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    # NOTE: supabase removed - using PostgreSQL only
    "logfire>=0.30.0",
    "fastapi>=0.119.1",
    "watchdog>=3.0.0",  # Auto-reload for development
    "asyncpg>=0.30.0",  # Database connectivity
    "psycopg2-binary>=2.9.11",  # Code metrics service (sync DB)
    "semgrep>=1.60.0",  # Code auditing
    "openai==1.71.0",  # RAG service dependencies
    "python-jose[cryptography]>=3.3.0",  # JWT utilities
    "cryptography>=41.0.0",  # Crypto utilities
    "psutil>=5.9.0",  # System utilities
    "tldextract>=5.0.0",  # URL parsing
]

# Agents container dependencies (ML/reranking service) - DISABLED
# agents = [
#     "pydantic>=2.12.3",
#     "fastapi>=0.119.1",
#     "uvicorn>=0.38.0",
#     "httpx>=0.28.1",
#     "python-dotenv>=1.1.1",
#     "structlog>=25.4.0",
# ]

# Agent Work Orders container dependencies (workflow orchestration service)
agent-work-orders = [
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    "structlog>=25.4.0",
    "sse-starlette>=2.3.3",
    # NOTE: supabase removed - using PostgreSQL only
]

# All dependencies for running unit tests locally
# This is auto-generated - do not edit manually
# Sources: server, mcp, agents, agent-work-orders, dev
all = [
    # Core (from server + mcp + agents)
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
    # Database (PostgreSQL only - no Supabase)
    "asyncpg>=0.30.0",
    # AI/ML
    "openai==1.71.0",
    # Document processing
    "docling>=2.0.0",
    "pypdf2>=3.0.1",
    "pdfplumber>=0.11.6",
    "python-docx>=1.1.2",
    "markdown>=3.8",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.9",
    # MCP
    "mcp==1.12.2",
    "watchfiles>=0.18",
    # Agents/ML
    "structlog>=25.4.0",
    # Agent Work Orders
    "sse-starlette>=2.3.3",
    # Utilities
    "tldextract>=5.0.0",
    "logfire>=0.30.0",
    "gitpython>=3.1.46",
    # Tree-sitter
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-language-pack>=0.7.2",
    # Code auditing
    "semgrep>=1.60.0",
    # Test dependencies
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=6.2.1",
    "factory-boy>=3.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long - handled by line-length
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

# Third-party libraries often don't have type stubs
# We'll explicitly type our own code but not fail on external libs
ignore_missing_imports = true
