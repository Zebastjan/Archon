rules:
  - id: nim-hardcoded-secret
    languages:
      - generic
    message: "Potential hardcoded secret detected. Use environment variables or a secrets manager instead."
    severity: ERROR
    patterns:
      # Pattern 1: let/var/const with secret-like name = "hardcoded"
      - pattern-either:
          - pattern: |
              let $VAR = "..."
          - pattern: |
              var $VAR = "..."
          - pattern: |
              const $VAR = "..."
      # Variable name contains secret-like terms
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret|token|api.?key|auth|credential|private.?key)
      # Not empty string
      - pattern-not: |
          let $VAR = ""
      - pattern-not: |
          var $VAR = ""
      - pattern-not: |
          const $VAR = ""
      # Not a placeholder
      - pattern-not: |
          let $VAR = "YOUR_..."
      - pattern-not: |
          var $VAR = "YOUR_..."
      - pattern-not: |
          const $VAR = "YOUR_..."
      - pattern-not: |
          let $VAR = "REPLACE_..."
      - pattern-not: |
          var $VAR = "REPLACE_..."
      - pattern-not: |
          const $VAR = "REPLACE_..."
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - nim
      confidence: MEDIUM
